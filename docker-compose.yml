version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docugauge-db
    environment:
      POSTGRES_USER: docugauge_user
      POSTGRES_PASSWORD: docugauge_password
      POSTGRES_DB: docugauge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: docugauge-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://docugauge_user:docugauge_password@db:5432/docugauge_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docugauge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
